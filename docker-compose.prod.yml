services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: "${VITE_API_URL:?Set VITE_API_URL to the browser-visible API URL}"
        VITE_ROOM_MODE: required
    ports: ["5173:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost/nomikai-app/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: sh -c "npm run migrate && npm start"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL to the PostgreSQL URL reachable from the API container}"
      REDIS_URL: "${REDIS_URL:?Set REDIS_URL to the Redis URL reachable from the API container}"
      CLIENT_ORIGIN: "${CLIENT_ORIGIN:?Set CLIENT_ORIGIN to the browser origin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      V2_REPOSITORY: postgres
      SOCKETIO_INSTANCES: ${SOCKETIO_INSTANCES:-1}
    ports: ["3000:3000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nomikai
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      POSTGRES_DB: nomikai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomikai -d nomikai"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  redis_data:
